---
# Infrastructure App of Apps Pattern
# This Application manages all infrastructure components
# Any new Application added to infrastructure/ will be auto-deployed
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
  # Finalizer ensures cascade delete of all managed infrastructure apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project: grouping/permission boundary
  project: default

  # SOURCE: Where are the infrastructure app definitions?
  source:
    # This repository
    repoURL: https://github.com/Mosher-Labs/homelab-gitops.git
    # Which branch to use
    targetRevision: main
    # Path to the infrastructure directory
    path: infrastructure
    # Directory mode - ArgoCD will look for Application manifests
    directory:
      # Recurse into subdirectories
      recurse: true
      # Only process YAML files that define Applications
      include: '*/application.yaml'

  # DESTINATION: Where should the child apps be created?
  destination:
    # Kubernetes cluster (in-cluster API)
    server: https://kubernetes.default.svc
    # Child apps will be created in argocd namespace
    namespace: argocd

  # SYNC POLICY: How should ArgoCD keep things in sync?
  syncPolicy:
    # Automated sync: auto-deploy when new infrastructure is added to Git
    automated:
      # Prune: delete apps removed from Git
      prune: true
      # SelfHeal: revert manual changes to match Git
      selfHeal: true
    # Sync options
    syncOptions:
      # Create the namespace if it doesn't exist
      - CreateNamespace=true
    # Retry policy if sync fails
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
