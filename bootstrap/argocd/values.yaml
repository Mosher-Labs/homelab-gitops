---
# ArgoCD Helm Chart Values - Single-node degraded mode
# macmini-2010 is offline (I/O errors); running on hp-elitedesk only.
# Restore replicas to 2 and remove hardAntiAffinity override when node returns.
# Values must be nested under 'argo-cd' for dependency chart

argo-cd:
  global:
    domain: argocd.mosher-labs.local

  configs:
    params:
      server.insecure: true  # Using Cloudflare tunnel

  # Redis HA: single replica while macmini-2010 is offline
  redis-ha:
    enabled: true
    replicas: 1
    hardAntiAffinity: false
    # Chart default (1) requires a replica to acknowledge writes, which a
    # single-pod deployment can never satisfy - every write fails with
    # "NOREPLICAS Not enough good replicas to write" (this is what blocked
    # ArgoCD from generating manifests for any app it hadn't already cached).
    # Revert to the chart default alongside `replicas` above once
    # macmini-2010 is back and redis-ha has real replicas again.
    config:
      min-replicas-to-write: 0
    haproxy:
      enabled: true
      replicas: 1
      hardAntiAffinity: false
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

  # Disable single Redis instance
  redis:
    enabled: false

  server:
    # HA: 2 replicas - one per node
    replicas: 2
    service:
      type: ClusterIP
    # Metrics for Prometheus
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
    # Ingress configuration for home network access
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - argocd.mosher-labs.local
      paths:
        - /
      pathType: Prefix
      annotations: {}
    # ArgoCD will manage itself and reference your repos
    config:
      repositories: |
        - type: git
          url: https://github.com/Mosher-Labs/homelab-gitops.git
        - type: git
          url: https://github.com/Mosher-Labs/helm-charts.git
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # HA: Topology spread - prefer one pod per node (resilient to node failures)
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: argocd-server
    # HA: Pod Disruption Budget
    pdb:
      enabled: true
      minAvailable: 1

  # Application Controller - single replica due to memory constraints
  controller:
    replicas: 1
    # Metrics for Prometheus
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 256Mi
    # HA: Topology spread - prefer one pod per node (resilient to node failures)
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: argocd-repo-server
    # HA: Pod Disruption Budget (disabled for single replica)
    pdb:
      enabled: false

  repoServer:
    # HA: 2 replicas for Git operations
    replicas: 2
    # Metrics for Prometheus
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # HA: Topology spread - prefer one pod per node (resilient to node failures)
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: argocd-repo-server
    # HA: Pod Disruption Budget
    pdb:
      enabled: true
      minAvailable: 1

  # HA: ApplicationSet Controller
  applicationSet:
    replicas: 2
    # Metrics for Prometheus
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    # HA: Topology spread - prefer one pod per node (resilient to node failures)
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: argocd-applicationset-controller
    # HA: Pod Disruption Budget
    pdb:
      enabled: true
      minAvailable: 1

  # Dex: Single replica (no HA support), but PDB for faster rescheduling
  dex:
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi
    # PDB to prevent disruption during maintenance
    pdb:
      enabled: true
      minAvailable: 1

  # Notifications: Single replica (leader election),
  # but PDB for faster rescheduling
  notifications:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # PDB to prevent disruption during maintenance
    pdb:
      enabled: true
      minAvailable: 1
