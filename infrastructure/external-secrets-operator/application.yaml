---
# ArgoCD Application for External Secrets Operator
# Manages secrets from external sources (1Password, Vault, etc.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  # Finalizer ensures cascade delete of deployed resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project: grouping/permission boundary
  project: default

  # SOURCE: Where is the Helm chart?
  source:
    # External Secrets Operator official Helm repo
    repoURL: https://charts.external-secrets.io
    # Which chart version to use
    chart: external-secrets
    targetRevision: 0.10.5
    # Helm values
    helm:
      values: |
        # Installation configuration
        installCRDs: true

        # Resource limits for homelab
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi

        # Webhook configuration
        webhook:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi

        # Cert controller configuration
        certController:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi

  # DESTINATION: Where should it be deployed?
  destination:
    # Kubernetes cluster (in-cluster API)
    server: https://kubernetes.default.svc
    # Target namespace
    namespace: external-secrets

  # SYNC POLICY: How should ArgoCD keep things in sync?
  syncPolicy:
    # Automated sync: auto-deploy on Git push
    automated:
      # Prune: delete resources removed from Git
      prune: true
      # SelfHeal: revert manual cluster changes to match Git
      selfHeal: true
    # Sync options
    syncOptions:
      # Create the namespace if it doesn't exist
      - CreateNamespace=true
      # Replace resources instead of patching
      - Replace=true
    # Retry policy if sync fails
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
