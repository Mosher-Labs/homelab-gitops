---
# ArgoCD Application for the OpenTelemetry Operator: injects OpenTelemetry
# agents into pods that opt in with an annotation, so apps we can't change
# still produce request metrics (homelab-gitops#153). The collector and the
# Instrumentation settings live in infrastructure/opentelemetry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.126.2
    helm:
      valuesObject:
        admissionWebhooks:
          # Only book-review-publisher opts into auto-instrumentation, via the
          # instrumentation.opentelemetry.io/inject-sdk annotation. Unscoped,
          # mpod.kb.io intercepts every pod CREATE in the cluster and burns its
          # 10s timeout whenever the operator has no endpoints, which helped
          # block pod creation during the 2026-10-22 outage. Add a namespace
          # here if another workload starts opting in.
          pods:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: book-review-publisher
          # cert-manager issues the webhook certificate and its CA injector
          # keeps the webhooks' caBundle in step with it. The chart's own
          # autoGenerateCert could not be used safely: ArgoCD renders with
          # helm template, which has no cluster access, so the chart's lookup
          # for an existing cert always came back empty and it minted a new
          # one on every render. recreate: false does not help, because it
          # only guards Helm upgrades. On 2026-10-25 that left the Secret
          # holding a cert from one render and the caBundle a CA from
          # another, and the API server rejected the webhook.
          autoGenerateCert:
            enabled: false
          certManager:
            enabled: true
            # Empty issuerRef means the chart's own self-signed Issuer, which
            # is what a webhook CA should be. Nothing external to trust it.
            issuerRef: {}
        manager:
          autoInstrumentation:
            # Off by default in the chart. Go has no in-process agent, so
            # the operator injects an eBPF sidecar instead (privileged; see
            # infrastructure/opentelemetry/README.md).
            go:
              enabled: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart installs CRDs that the operator's own resources use.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
