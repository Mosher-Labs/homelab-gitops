---
# ArgoCD Application for the OpenTelemetry Operator: injects OpenTelemetry
# agents into pods that opt in with an annotation, so apps we can't change
# still produce request metrics (homelab-gitops#153). The collector and the
# Instrumentation settings live in infrastructure/opentelemetry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.124.1
    helm:
      valuesObject:
        admissionWebhooks:
          # No cert-manager here: the chart generates the webhook
          # certificate itself.
          autoGenerateCert:
            enabled: true
            # The chart makes a new random certificate on every render, and
            # ArgoCD renders often. Keep the first one (see ignoreDifferences).
            recreate: false
          certManager:
            enabled: false
        manager:
          autoInstrumentation:
            # Off by default in the chart. Go has no in-process agent, so
            # the operator injects an eBPF sidecar instead (privileged; see
            # infrastructure/opentelemetry/README.md).
            go:
              enabled: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry

  # The generated webhook certificate differs on every render. Without this,
  # ArgoCD would apply the Secret and the webhooks' caBundle from different
  # renders, and the API server would reject the webhook's certificate.
  ignoreDifferences:
    - kind: Secret
      name: opentelemetry-operator-controller-manager-service-cert
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: opentelemetry-operator-mutation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: opentelemetry-operator-validation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart installs CRDs that the operator's own resources use.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
