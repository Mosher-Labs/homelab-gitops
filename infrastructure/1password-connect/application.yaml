---
# ArgoCD Application for 1Password Connect Server
# Provides secure access to 1Password secrets from Kubernetes
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onepassword-connect
  namespace: argocd
  # Finalizer ensures cascade delete of deployed resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project: grouping/permission boundary
  project: default

  # SOURCE: Where is the Helm chart?
  source:
    # 1Password official Helm repo
    repoURL: https://1password.github.io/connect-helm-charts
    # Which chart to use
    chart: connect
    targetRevision: 1.15.1
    # Helm values
    helm:
      values: |
        # Connect server configuration
        connect:
          # Resource limits for homelab
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

          # Credentials secret
          # This secret must be created manually before deploying
          # It contains the 1password-credentials.json file
          credentials:
            name: onepassword-credentials
            key: 1password-credentials.json

        # Operator configuration (creates SecretStore automatically)
        operator:
          # Enable the operator
          create: true

          # Auto-restart deployments when secrets change
          autoRestart: true

          # Resource limits
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi

          # Token for operator to authenticate with Connect
          token:
            name: onepassword-token
            key: token

  # DESTINATION: Where should it be deployed?
  destination:
    # Kubernetes cluster (in-cluster API)
    server: https://kubernetes.default.svc
    # Target namespace
    namespace: onepassword

  # SYNC POLICY: How should ArgoCD keep things in sync?
  syncPolicy:
    # Manual sync initially - we need to create credentials first
    # Change to automated after credentials are in place
    automated:
      prune: true
      selfHeal: true
    # Sync options
    syncOptions:
      # Create the namespace if it doesn't exist
      - CreateNamespace=true
    # Retry policy if sync fails
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
