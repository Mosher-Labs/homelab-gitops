---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-benniemosher
  namespace: renovate
  labels:
    app: renovate
    org: benniemosher
spec:
  # Stagger schedule to avoid running simultaneously
  schedule: "15 3 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: renovate
            org: benniemosher
        spec:
          restartPolicy: Never
          initContainers:
            - name: token-generator
              image: alpine:3.23
              command: ["/bin/sh", "/scripts/generate-token.sh"]
              env:
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: app-id
                - name: GITHUB_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: installation-id-benniemosher
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: github-app-secret
                  mountPath: /secrets
                  readOnly: true
                - name: token
                  mountPath: /token
          containers:
            - name: renovate
              image: renovate/renovate:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  export RENOVATE_TOKEN=$(cat /token/github-token)
                  exec renovate
              env:
                - name: RENOVATE_PLATFORM
                  value: "github"
                - name: RENOVATE_ENDPOINT
                  value: "https://api.github.com"
                - name: RENOVATE_GIT_AUTHOR
                  # yamllint disable-line rule:line-length
                  value: "eikthyrnirbot[bot] <245716739+eikthyrnirbot[bot]@users.noreply.github.com>"
                - name: LOG_LEVEL
                  value: "info"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: "optional"
                - name: RENOVATE_CONFIG_FILE
                  value: "/config/config.json"
                # User-specific autodiscover filter
                - name: RENOVATE_AUTODISCOVER_FILTER
                  value: "benniemosher/*"
                - name: RENOVATE_AUTODISCOVER_TOPICS
                  value: "renovate"
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: token
                  mountPath: /token
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 2Gi
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: scripts
              configMap:
                name: renovate-token-generator
                defaultMode: 0755
            - name: github-app-secret
              secret:
                secretName: renovate-github-app
            - name: token
              emptyDir: {}
