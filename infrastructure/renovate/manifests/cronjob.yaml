---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
  labels:
    app: renovate
spec:
  # Run once daily at 2am (reduce cluster load for 2-node setup)
  schedule: "0 2 * * *"
  # Suspend to allow manual execution during testing
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: renovate
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: renovate/renovate:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  export RENOVATE_GITHUB_APP_KEY="$(cat /secrets/private-key)"
                  exec renovate
              env:
                # Platform
                - name: RENOVATE_PLATFORM
                  value: "github"
                - name: RENOVATE_ENDPOINT
                  value: "https://api.github.com"
                # GitHub App authentication (supports multiple orgs)
                - name: RENOVATE_GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: app-id
                # Git author
                - name: RENOVATE_GIT_AUTHOR
                  value: "EikthyrnirBot <bot@renovateapp.com>"
                # Log level and debugging
                - name: LOG_LEVEL
                  value: "info"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: "optional"
                # Config file
                - name: RENOVATE_CONFIG_FILE
                  value: "/config/config.json"
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: github-app-secret
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 2Gi
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: github-app-secret
              secret:
                secretName: renovate-github-app
