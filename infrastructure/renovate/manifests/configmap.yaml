---
# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: renovate
data:
  config.json: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "extends": [
        "config:recommended",
        ":gitSignOff"
      ],
      "platform": "github",
      "gitAuthor": "EikthyrnirBot <bot@renovateapp.com>",
      "autodiscover": true,
      "repositoryCache": "enabled",
      "prConcurrentLimit": 5,
      "prHourlyLimit": 2,
      "timezone": "America/Denver",
      "dependencyDashboard": true,
      "dependencyDashboardTitle": "🤖 Renovate Dependency Dashboard",
      "semanticCommits": "enabled",
      "commitMessagePrefix": "chore(deps):",
      "commitMessageAction": "update",
      "commitMessageExtra": "to {{newValue}}",
      "commitMessageTopic": "{{depName}}",
      "automerge": false,
      "platformAutomerge": false,
      "rebaseWhen": "behind-base-branch",
      "labels": [
        "dependencies",
        "renovate"
      ],
      "assignees": [
        "@benniemosher"
      ],
      "reviewers": [],
      "vulnerabilityAlerts": {
        "labels": [
          "security",
          "dependencies"
        ],
        "assignees": [
          "@benniemosher"
        ]
      },
      "packageRules": [
        {
          "description": "Disable Renovate for tidr (too memory intensive)",
          "matchRepositories": ["Mosher-Labs/tidr"],
          "enabled": false
        },
        {
          "description": "Helm charts - group by application",
          "matchDatasources": [
            "helm"
          ],
          "matchUpdateTypes": [
            "minor",
            "patch"
          ],
          "groupName": "helm charts",
          "automerge": false
        },
        {
          "description": "Helm charts - major updates separate",
          "matchDatasources": [
            "helm"
          ],
          "matchUpdateTypes": [
            "major"
          ],
          "labels": [
            "dependencies",
            "renovate",
            "major-update"
          ]
        },
        {
          "description": "GitHub Actions - group all updates",
          "matchManagers": [
            "github-actions"
          ],
          "groupName": "GitHub Actions",
          "automerge": true,
          "automergeType": "pr"
        },
        {
          "description": "Docker images - group updates",
          "matchDatasources": [
            "docker"
          ],
          "groupName": "docker images",
          "automerge": false
        },
        {
          "description": "Pre-commit hooks - major/minor only",
          "matchManagers": [
            "pre-commit"
          ],
          "matchUpdateTypes": [
            "major",
            "minor"
          ],
          "groupName": "pre-commit hooks"
        },
        {
          "description": "Pre-commit hooks - ignore patches",
          "matchManagers": [
            "pre-commit"
          ],
          "matchUpdateTypes": [
            "patch"
          ],
          "enabled": false
        },
        {
          "description": "Critical security updates",
          "matchUpdateTypes": [
            "patch"
          ],
          "matchCurrentVersion": "!/^0/",
          "automerge": true,
          "automergeType": "pr",
          "labels": [
            "dependencies",
            "security",
            "automerge"
          ]
        },
        {
          "description": "Ruby gems - group non-security updates",
          "matchManagers": [
            "bundler"
          ],
          "matchUpdateTypes": [
            "minor",
            "patch"
          ],
          "groupName": "Ruby dependencies"
        }
      ],
      "customManagers": [
        {
          "customType": "regex",
          "description": "Update _VERSION variables in Dockerfiles",
          "fileMatch": [
            "(^|/|\\.)Dockerfile$",
            "(^|/)Dockerfile\\.[^/]*$"
          ],
          "matchStrings": [
            "datasource=(?<datasource>.*?) depName=(?<depName>.*?)( versioning=(?<versioning>.*?))?\\s.*?_VERSION=(?<currentValue>.*)\\s"
          ],
          "versioningTemplate":
            "{{#if versioning}}{{{versioning}}}{{else}}semver{{/if}}"
        }
      ],
      "helm-values": {
        "fileMatch": [
          "values\\.ya?ml$",
          "application\\.ya?ml$"
        ]
      },
      "argocd": {
        "fileMatch": [
          "application\\.ya?ml$",
          "applications/.+\\.ya?ml$"
        ]
      },
      "kubernetes": {
        "fileMatch": [
          "manifests/.+\\.ya?ml$",
          "k8s/.+\\.ya?ml$"
        ]
      }
    }
