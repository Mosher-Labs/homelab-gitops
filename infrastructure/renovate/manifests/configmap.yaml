---
# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: renovate
data:
  config.json: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "extends": [
        "config:recommended",
        ":gitSignOff",
        "helpers:pinGitHubActionDigests",
        "docker:pinDigests"
      ],
      "platform": "github",
      "gitAuthor": "eikthyrnirbot[bot] <245716739+eikthyrnirbot[bot]@users.noreply.github.com>",
      "autodiscover": true,
      "repositoryCache": "enabled",
      "prConcurrentLimit": 0,
      "prHourlyLimit": 0,
      "pruneStaleBranches": true,
      "timezone": "America/Denver",
      "dependencyDashboard": true,
      "dependencyDashboardTitle": "🤖 Renovate Dependency Dashboard",
      "semanticCommits": "enabled",
      "commitMessagePrefix": "chore(deps):",
      "commitMessageAction": "update",
      "commitMessageExtra": "to {{newValue}}",
      "commitMessageTopic": "{{depName}}",
      "automerge": false,
      "platformAutomerge": true,
      "rebaseWhen": "auto",
      "rangeStrategy": "pin",
      "labels": [
        "dependencies",
        "renovate"
      ],
      "assignees": [
        "@benniemosher"
      ],
      "assignAutomerge": true,
      "reviewers": [],
      "vulnerabilityAlerts": {
        "labels": [
          "security",
          "dependencies"
        ],
        "assignees": [
          "@benniemosher"
        ]
      },
      "packageRules": [
        {
          "description": "Homebridge publishes date tags (YYYY-MM-DD); ignore the alpha-/beta-/synology- variants",
          "matchPackageNames": ["homebridge/homebridge"],
          "versioning": "regex:^(?<major>\\d{4})-(?<minor>\\d{2})-(?<patch>\\d{2})$"
        },
        {
          "description": "Group all non-major npm updates together",
          "matchManagers": ["npm"],
          "matchUpdateTypes": ["minor", "patch", "pin", "digest", "lockFileMaintenance"],
          "groupName": "npm non-major updates"
        },
        {
          "description": "Group all major npm updates together",
          "matchManagers": ["npm"],
          "matchUpdateTypes": ["major"],
          "groupName": "npm major updates"
        },
        {
          "description": "Automerge minor/patch updates",
          "matchUpdateTypes": ["minor", "patch"],
          "automerge": true,
          "automergeType": "pr"
        },
        {
          "description": "Helm charts - group by application",
          "matchDatasources": [
            "helm"
          ],
          "matchUpdateTypes": [
            "minor",
            "patch"
          ],
          "groupName": "helm charts",
          "automerge": false
        },
        {
          "description": "Helm charts - major updates separate",
          "matchDatasources": [
            "helm"
          ],
          "matchUpdateTypes": [
            "major"
          ],
          "labels": [
            "dependencies",
            "renovate",
            "major-update"
          ]
        },
        {
          "description": "GitHub Actions - group and automerge non-major",
          "matchManagers": ["github-actions"],
          "matchUpdateTypes": ["minor", "patch"],
          "groupName": "github-actions non-major",
          "automerge": true,
          "automergeType": "pr"
        },
        {
          "description": "GitHub Actions - group major updates",
          "matchManagers": ["github-actions"],
          "matchUpdateTypes": ["major"],
          "groupName": "github-actions major"
        },
        {
          "description": "Docker images - group updates",
          "matchDatasources": [
            "docker"
          ],
          "groupName": "docker images",
          "automerge": false
        },
        {
          "description": "Pre-commit hooks - major, minor, and patch",
          "matchFileNames": [
            "**/.pre-commit-config.yaml"
          ],
          "matchUpdateTypes": [
            "major",
            "minor",
            "patch"
          ],
          "groupName": "pre-commit hooks"
        },
        {
          "description": "Critical security updates",
          "matchUpdateTypes": [
            "patch"
          ],
          "matchCurrentVersion": "!/^0/",
          "automerge": true,
          "automergeType": "pr",
          "labels": [
            "dependencies",
            "security",
            "automerge"
          ]
        },
        {
          "description": "Ruby gems - group non-security updates",
          "matchManagers": [
            "bundler"
          ],
          "matchUpdateTypes": [
            "minor",
            "patch"
          ],
          "groupName": "Ruby dependencies"
        },
        {
          "description": "Mosher-Labs/.github and pre-commit-autoupdate release on every merge; take their updates weekly. The CronJob runs 02:00 UTC Monday, which is Sunday evening in America/Denver",
          "matchPackageNames": ["Mosher-Labs/.github", "mosher-labs/pre-commit-autoupdate", "Mosher-Labs/pre-commit-autoupdate"],
          "schedule": ["on sunday"]
        },
        {
          "description": "Pin pre-commit hook revs to commit SHAs (rev: <sha>  # frozen: vX.Y.Z); there is no preset for this",
          "matchFileNames": ["**/.pre-commit-config.yaml"],
          "pinDigests": true
        },
        {
          "description": "Pinning to a digest or SHA changes nothing that runs, so merge it automatically. Keep last: later rules win, and the docker/helm rules set automerge false",
          "matchUpdateTypes": ["pin", "pinDigest"],
          "automerge": true,
          "automergeType": "pr"
        }
      ],
      "customManagers": [
        {
          "customType": "regex",
          "description": "Pre-commit hook revs, pinned to commit SHAs as rev: <sha>  # frozen: vX.Y.Z. Replaces the built-in pre-commit manager, which cannot write a pinned rev",
          "fileMatch": ["(^|/)\\.pre-commit-config\\.ya?ml$"],
          "matchStrings": [
            "-\\s+repo:\\s+https://github\\.com/(?<depName>[^/\\s]+/[^/\\s]+?)(?:\\.git)?\\s*\\n(?<indentation>[ \\t]+)rev:\\s+(?:(?<currentDigest>[0-9a-f]{40})\\s+#\\s*frozen:\\s*)?\"?(?<currentValue>v?\\d+\\.[^\"\\s#]*)\"?[ \\t]*\\n"
          ],
          "datasourceTemplate": "github-tags",
          "depTypeTemplate": "pre-commit",
          "autoReplaceStringTemplate": "- repo: https://github.com/{{{depName}}}\n{{{indentation}}}rev: {{#if newDigest}}{{{newDigest}}}  # frozen: {{{newValue}}}{{else}}{{{newValue}}}{{/if}}\n"
        },
        {
          "customType": "regex",
          "description": "Keep NODE_VERSION in netlify.toml in sync with .node-version",
          "fileMatch": ["(^|/)netlify\\.toml$"],
          "matchStrings": ["NODE_VERSION = \"(?<currentValue>[^\"]+)\""],
          "depNameTemplate": "node",
          "datasourceTemplate": "node-version",
          "versioningTemplate": "node"
        },
        {
          "customType": "regex",
          "description": "Update digest-pinned images used by local docker_image hooks in .pre-commit-config.yaml",
          "fileMatch": ["(^|/)\\.pre-commit-config\\.ya?ml$"],
          "matchStrings": [
            "entry:\\s+(?<depName>[^\\s:@]+):(?<currentValue>[^\\s@]+)@(?<currentDigest>sha256:[a-f0-9]{64})"
          ],
          "datasourceTemplate": "docker"
        },
        {
          "customType": "regex",
          "description": "Update _VERSION variables in Dockerfiles",
          "fileMatch": [
            "(^|/|\\.)Dockerfile$",
            "(^|/)Dockerfile\\.[^/]*$"
          ],
          "matchStrings": [
            "datasource=(?<datasource>.*?) depName=(?<depName>.*?)( versioning=(?<versioning>.*?))?\\s.*?_VERSION=(?<currentValue>.*)\\s"
          ],
          "versioningTemplate":
            "{{#if versioning}}{{{versioning}}}{{else}}semver{{/if}}"
        }
      ],
      "pre-commit": {
        "enabled": false
      },
      "helm-values": {
        "fileMatch": [
          "values\\.ya?ml$",
          "application\\.ya?ml$"
        ]
      },
      "argocd": {
        "fileMatch": [
          "application\\.ya?ml$",
          "applications/.+\\.ya?ml$"
        ]
      },
      "kubernetes": {
        "fileMatch": [
          "manifests/.+\\.ya?ml$",
          "k8s/.+\\.ya?ml$"
        ]
      }
    }
