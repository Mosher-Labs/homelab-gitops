---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-benniemosher-dev
  namespace: renovate
  annotations:
    checkov.io/skip1: CKV_K8S_22=Renovate installs tools at runtime
  labels:
    app: renovate
    org: benniemosher-dev
spec:
  schedule: "0 4 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: renovate
            org: benniemosher-dev
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            # The renovate image's own user, which owns its home directory.
            runAsUser: 12021
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Same image as the main container, so it is already on the node and
            # has openssl and curl without installing packages as root.
            - name: token-generator
              image: renovate/renovate:44.132.2@sha256:0191afbc3937e5316263426fc0ce1450f5c143d42e3f91da8c6f771e317fae51  # yamllint disable-line rule:line-length
              command: ["/bin/sh", "/scripts/generate-token.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: app-id
                - name: GITHUB_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-app
                      key: installation-id-benniemosher-dev
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: github-app-secret
                  mountPath: /secrets
                  readOnly: true
                - name: token
                  mountPath: /token
          containers:
            - name: renovate
              image: renovate/renovate:44.132.2@sha256:0191afbc3937e5316263426fc0ce1450f5c143d42e3f91da8c6f771e317fae51  # yamllint disable-line rule:line-length
              command: ["/bin/sh", "-c"]
              args:
                - |
                  export RENOVATE_TOKEN=$(cat /token/github-token)
                  exec renovate
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: RENOVATE_PLATFORM
                  value: "github"
                - name: RENOVATE_ENDPOINT
                  value: "https://api.github.com"
                - name: RENOVATE_GIT_AUTHOR
                  # yamllint disable-line rule:line-length
                  value: "eikthyrnirbot[bot] <245716739+eikthyrnirbot[bot]@users.noreply.github.com>"
                - name: LOG_LEVEL
                  value: "info"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: "optional"
                - name: RENOVATE_CONFIG_FILE
                  value: "/config/config.json"
                # Org-specific autodiscover filter
                - name: RENOVATE_AUTODISCOVER_FILTER
                  value: "benniemosher-dev/*"
                - name: RENOVATE_AUTODISCOVER_TOPICS
                  value: "renovate"
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: token
                  mountPath: /token
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 3Gi
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: scripts
              configMap:
                name: renovate-token-generator
                defaultMode: 0755
            - name: github-app-secret
              secret:
                secretName: renovate-github-app
            - name: token
              emptyDir: {}
