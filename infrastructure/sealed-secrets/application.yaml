---
# ArgoCD Application for Sealed Secrets
# Encrypts secrets so they can be safely stored in Git
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  # Finalizer ensures cascade delete of deployed resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project: grouping/permission boundary
  project: default

  # SOURCE: Where is the Helm chart?
  source:
    # Sealed Secrets official Helm repo
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    # Which chart to use
    chart: sealed-secrets
    targetRevision: 2.16.2
    # Helm values
    helm:
      values: |
        # Controller configuration
        fullnameOverride: sealed-secrets-controller

        # Resource limits for homelab
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 65534

        # Create cluster role binding
        rbac:
          create: true
          pspEnabled: false

        # Service account
        serviceAccount:
          create: true
          name: sealed-secrets-controller

  # DESTINATION: Where should it be deployed?
  destination:
    # Kubernetes cluster (in-cluster API)
    server: https://kubernetes.default.svc
    # Target namespace
    namespace: kube-system

  # SYNC POLICY: How should ArgoCD keep things in sync?
  syncPolicy:
    # Automated sync: auto-deploy on Git push
    automated:
      # Prune: delete resources removed from Git
      prune: true
      # SelfHeal: revert manual cluster changes to match Git
      selfHeal: true
    # Sync options
    syncOptions:
      # Create the namespace if it doesn't exist
      - CreateNamespace=true
    # Retry policy if sync fails
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
