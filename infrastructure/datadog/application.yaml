---
# ArgoCD Application for the Datadog Agent, on the free trial. It sends
# cluster metrics to Datadog, where infrastructure/datadog-alerts' monitors
# (modules/datadog in terraform-kubernetes-observability) alert on them.
# See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # The API key and the Cluster Agent token, as SealedSecrets.
    - repoURL: https://github.com/Mosher-Labs/homelab-gitops.git
      targetRevision: main
      path: infrastructure/datadog/manifests

    - repoURL: https://helm.datadoghq.com
      chart: datadog
      targetRevision: 3.251.1
      helm:
        valuesObject:
          clusterAgent:
            enabled: true
            # It sits at 165-195Mi (peak 211Mi sampled) and was OOM killed at
            # the old 256Mi limit, so: request 1.25x the average, and a limit
            # with room above the peak, rounded to the usual sizes.
            resources:
              limits:
                cpu: 200m
                memory: 384Mi
              requests:
                cpu: 50m
                memory: 256Mi
            # A fixed token. Without it the chart generates one on every
            # render, which keeps the app OutOfSync and rolls the pods.
            # yamllint disable-line rule:line-length
            tokenExistingSecret: datadog-cluster-agent-token  # checkov:skip=CKV_SECRET_6: The name of a Secret, not a secret value

          agents:
            # The host's systemd socket, for the systemd check below.
            volumeMounts:
              - name: systemd
                mountPath: /host/run/systemd/
            volumes:
              - name: systemd
                hostPath:
                  path: /run/systemd/
            containers:
              agent:
                resources:
                  limits:
                    cpu: 300m
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi

          datadog:
            # yamllint disable-line rule:line-length
            apiKeyExistingSecret: datadog-secret  # checkov:skip=CKV_SECRET_6: The name of a Secret, not a secret value
            # The monitors in infrastructure/datadog-alerts match this as
            # kube_cluster_name.
            clusterName: homelab
            # k3s runs its own containerd, and its kubelet serves a
            # self-signed certificate.
            criSocketPath: /run/k3s/containerd/containerd.sock
            kubelet:
              tlsVerify: false
            kubeStateMetricsCore:
              enabled: true
            # The systemd check (homelab-gitops#173), for the units that the
            # "systemd service failed" monitor watches. A regex matches only
            # the units a node has: k3s on the control plane, k3s-agent on the
            # other node. Tested with a throwaway Agent pod on both nodes.
            confd:
              systemd.yaml: |-
                init_config:
                instances:
                  - unit_regexes:
                      - '^(k3s|k3s-agent|chrony|systemd-timesyncd|ssh)\.service$'
                    private_socket: /host/run/systemd/private
            # Service Discovery is on by default in new Agents. It runs the
            # system-probe container with extra capabilities, which the
            # monitors don't need.
            discovery:
              enabled: false
            # Logs stay in Loki, and traces in the OpenTelemetry collector.
            logs:
              enabled: false
            apm:
              portEnabled: false
              socketEnabled: false
            processAgent:
              enabled: false
            site: datadoghq.com

          operator:
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 20m
                memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: datadog

  # The chart puts a new random install ID in this ConfigMap on every render.
  ignoreDifferences:
    - kind: ConfigMap
      name: datadog-installinfo
      jsonPointers:
        - /data

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
