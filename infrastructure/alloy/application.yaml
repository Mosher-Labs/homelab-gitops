---
# ArgoCD Application for Grafana Alloy: ships every pod's logs to Loki
# (infrastructure/loki) with namespace, pod, container, app and cluster labels.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.1
    helm:
      valuesObject:
        alloy:
          # Each Alloy tails only its own node, so it has to know which
          # node it is scheduled on.
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          mounts:
            # Host /var/log, where the kubelet writes
            # /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log.
            varlog: true
          configMap:
            # Alloy's own config language; its labels don't fit in 80 columns.
            # yamllint disable rule:line-length
            content: |
              // Watch only this node's pods. The field selector keeps the
              // list/watch scoped server-side instead of every Alloy
              // watching every pod in the cluster.
              discovery.kubernetes "pods" {
                role = "pod"

                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + env("NODE_NAME")
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }

                // Resolve each container to its log file on the host.
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                  action        = "replace"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.cri.receiver]
              }

              // k3s runs containerd, so each line on disk is CRI-formatted:
              // "<timestamp> <stream> <flags> <message>".
              loki.process "cri" {
                stage.cri {}

                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
                external_labels = {
                  cluster = "homelab",
                }
              }
            # yamllint enable rule:line-length
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
        # One Alloy per node, each reading that node's log files off disk.
        # The previous config used loki.source.kubernetes, which streams
        # every container's logs through the API server. That generated
        # roughly 4.3M pods/log requests, saturated the apiserver's
        # workload-low priority queue, and took the cluster down on
        # 2026-10-22.
        controller:
          type: daemonset

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
