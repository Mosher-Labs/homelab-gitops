---
# The collector's Prometheus exporter, for the request metrics it derives.
# Scraped by servicemonitor.yaml.
apiVersion: v1
kind: Service
metadata:
  name: otel-metrics
  namespace: opentelemetry
  labels:
    app.kubernetes.io/name: otel-metrics
spec:
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: opentelemetry.otel
  ports:
    - name: metrics
      port: 8889
      targetPort: 8889
