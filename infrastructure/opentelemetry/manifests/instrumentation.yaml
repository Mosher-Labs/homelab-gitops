---
# Settings for injected agents. Opt a pod in with an annotation on its
# template, for example:
#   instrumentation.opentelemetry.io/inject-go: "opentelemetry/default"
#   instrumentation.opentelemetry.io/otel-go-auto-target-exe: /path/to/binary
# (inject-nodejs, inject-python and inject-java work the same way.)
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: default
  namespace: opentelemetry
spec:
  exporter:
    endpoint: http://otel-collector.opentelemetry.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    # Every request: the spans become request metrics, so sampling would
    # undercount traffic.
    type: parentbased_always_on
