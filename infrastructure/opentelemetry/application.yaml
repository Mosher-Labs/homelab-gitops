---
# ArgoCD Application for the OpenTelemetry collector and the Instrumentation
# settings that injected agents use. Needs the operator's CRDs
# (infrastructure/opentelemetry-operator), so it syncs after it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Mosher-Labs/homelab-gitops.git
    targetRevision: main
    path: infrastructure/opentelemetry/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs come from the operator app; don't fail the dry run if it
      # hasn't installed them yet.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
