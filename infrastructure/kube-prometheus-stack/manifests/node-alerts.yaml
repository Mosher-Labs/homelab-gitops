---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
# Homelab-specific node alerts. The general node alerts (not ready, pressure,
# disk, memory, network) come from the observability module's Grafana alerts
# in infrastructure/observability-alerts.
metadata:
  name: node-monitoring-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: node.rules
      interval: 30s
      rules:
        # A declared mount vanished from node-exporter output
        - alert: NodeExpectedMountMissing
          expr: |
            absent(node_filesystem_size_bytes{
              mountpoint="/var/lib/rancher/k3s/storage"})
            or absent(node_filesystem_size_bytes{mountpoint="/data"})
          for: 5m
          labels:
            severity: critical
            component: storage
          annotations:
            summary: "Expected mount {{ $labels.mountpoint }} is missing"
            description: |
              No filesystem metrics exist for {{ $labels.mountpoint }}.
              These volumes are mounted with nofail, so a node boots and
              reports Ready without them and every threshold alert on the
              mount goes quiet rather than firing.
              For /var/lib/rancher/k3s/storage this silently removes the
              cap on local-path PV growth and sends new PVs back to the
              root disk.
              Check findmnt and lvs on the node.
