---
# ArgoCD Application for kube-prometheus-stack
# Complete monitoring stack: Prometheus + Grafana (alerting is in Grafana)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  # Finalizer ensures cascade delete of deployed resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project: grouping/permission boundary
  project: default

  # SOURCES: Multiple sources for Helm chart + manifests
  sources:
    # Custom manifests (sealed secrets, PrometheusRules)
    - repoURL: https://github.com/Mosher-Labs/homelab-gitops.git
      targetRevision: main
      path: infrastructure/kube-prometheus-stack/manifests

    # Helm chart source
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.9.0
      helm:
        valuesObject:
          # Alerting goes through Grafana only (infrastructure/observability-
          # alerts, homelab-gitops#166). The module's catalog covers what the
          # built-in alerts did, so the alert-only rule groups are off. The
          # recording rule groups stay on: the built-in dashboards use them.
          defaultRules:
            rules:
              alertmanager: false
              configReloaders: false
              etcd: false
              general: false
              kubeApiserverSlos: false
              kubeControllerManager: false
              kubeProxy: false
              kubeSchedulerAlerting: false
              kubeStateMetrics: false
              kubernetesApps: false
              kubernetesResources: false
              kubernetesStorage: false
              kubernetesSystem: false
              network: false
              nodeExporterAlerting: false
              prometheus: false
              prometheusOperator: false
              windows: false

          # Series reduction (2026-10-03): 158k active series, and only 303
          # of 2,483 metric names are used by any rule or dashboard.
          # k3s runs the API server, scheduler and kubelet in one process, so
          # the kubelet's /metrics also serves the API server's metrics, which
          # the apiserver job already scrapes. Both lists keep the chart's
          # default drop rule.
          kubelet:
            serviceMonitor:
              metricRelabelings:
                # Chart default: fewer storage-operation buckets.
                - action: drop
                  sourceLabels: [__name__, le]
                  regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
                # The API server's own metrics, duplicated on the kubelet
                # endpoint. Nothing queries them with job="kubelet".
                - action: drop
                  sourceLabels: [__name__]
                  regex: (apiserver|etcd|scheduler|workqueue|authentication|authorization|aggregator|apiextensions|admission)_.+
          kubeApiServer:
            serviceMonitor:
              metricRelabelings:
                # Chart default: fewer API server latency buckets.
                - action: drop
                  sourceLabels: [__name__, le]
                  regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
                # Histograms no rule or dashboard reads (checked against every
                # PrometheusRule, Grafana dashboard and Grafana alert rule).
                - action: drop
                  sourceLabels: [__name__]
                  regex: (apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|workqueue_work_duration_seconds|scheduler_plugin_execution_duration_seconds)_bucket

          # Prometheus Operator Configuration
          prometheusOperator:
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # Prometheus Server Configuration
          prometheus:
            prometheusSpec:
              # Data retention. 91 days covers every SLO window (7, 30 and 90
              # days; see docs/slos). 14 days used 5.3 GB (2026-10-06), so 91
              # days is an estimated 35 GB. retentionSize is the hard cap,
              # above that estimate. Prometheus runs on hp-elitedesk, whose
              # disk has 1.8 TB free. The local-path volume doesn't enforce the
              # 15Gi claim below, so the node's disk is the real limit.
              retention: 91d
              retentionSize: "50GB"
              # Storage
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 15Gi
              # Resource limits, sized from 14 days of data (2026-10-03):
              # average 628Mi, max 900Mi. Request 1.25x average, limit 1.5x
              # max. It now also scrapes LiftTrace, Loki, Alloy and 11
              # blackbox probes, and serves the observability-alerts rules.
              resources:
                limits:
                  cpu: 500m
                  memory: 1536Mi
                requests:
                  cpu: 200m
                  memory: 768Mi
              # Service monitors
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false

          # Grafana Configuration
          grafana:
            # Admin credentials come from the grafana-admin SealedSecret in
            # manifests/ (the password is the "Grafana" item in 1Password).
            admin:
              existingSecret: grafana-admin
              userKey: admin-user
              # checkov:skip=CKV_SECRET_6: A Secret key name, not a value
              passwordKey: admin-password
            # Ingress for Grafana UI
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - grafana.mosher-labs.local
            # Resource limits. Grafana 13 runs an in-process API server; at
            # 256Mi / 200m it sat at its memory limit, SQLite calls timed out,
            # and failed health checks took it out of the Service. Since it
            # also evaluates the observability-alerts rules, 768Mi left it at
            # 80% (612Mi) under load, so 1Gi.
            resources:
              limits:
                cpu: 1000m
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            # Logs from infrastructure/loki
            additionalDataSources:
              - name: Loki
                type: loki
                uid: loki
                url: http://loki.monitoring.svc.cluster.local:3100
                access: proxy
            # Persistence
            persistence:
              enabled: true
              size: 5Gi
              storageClassName: local-path
            # Grafana configuration
            grafana.ini:
              server:
                root_url: http://grafana.mosher-labs.local
              analytics:
                check_for_updates: false
                reporting_enabled: false

          # Off: Grafana sends every alert (see defaultRules above).
          alertmanager:
            enabled: false

          # Disable k3s-incompatible components
          # k3s doesn't expose these as separate pods
          kubeEtcd:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          # kube-proxy is built into the k3s agent, so absent(up{job=
          # "kube-proxy"}) fires permanently and can never resolve.
          kubeProxy:
            enabled: false

          # Node exporter - collects node metrics
          nodeExporter:
            enabled: true

          # The systemd collector (homelab-gitops#173): node_systemd_unit_state
          # for the units the node_systemd_service_failed rule watches. k3s on
          # the control plane, k3s-agent on the other node, plus time sync and
          # ssh. A unit a node doesn't have just doesn't appear.
          prometheus-node-exporter:
            containerSecurityContext:
              # Ubuntu's default container AppArmor profile blocks D-Bus
              # ("An AppArmor policy prevents this sender from sending this
              # message"), so the collector can't connect. Tested on both
              # nodes with a throwaway pod: Unconfined is what lets it
              # connect, as a non-root user with a read-only filesystem.
              appArmorProfile:
                type: Unconfined
            extraArgs:
              # The chart's defaults, repeated because a list replaces them.
              # yamllint disable-line rule:line-length
              - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
              # yamllint disable-line rule:line-length
              - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
              - --collector.systemd
              - '--collector.systemd.unit-include=^(k3s|k3s-agent|chrony|systemd-timesyncd|ssh)\.service$'
            extraHostVolumeMounts:
              - name: dbus
                hostPath: /run/dbus/system_bus_socket
                mountPath: /var/run/dbus/system_bus_socket
                readOnly: true
                type: Socket

          # Kube-state-metrics - collects K8s object metrics
          kube-state-metrics:
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 64Mi

  # DESTINATION: Where should it be deployed?
  destination:
    # Kubernetes cluster (in-cluster API)
    server: https://kubernetes.default.svc
    # Target namespace
    namespace: monitoring

  # SYNC POLICY: How should ArgoCD keep things in sync?
  syncPolicy:
    # Automated sync: auto-deploy on Git push
    automated:
      prune: true
      selfHeal: true
    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Retry policy if sync fails
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
