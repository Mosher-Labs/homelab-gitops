---
# ArgoCD Application for kube-prometheus-stack
# Complete monitoring stack: Prometheus + Grafana + AlertManager
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  # Finalizer ensures cascade delete of deployed resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project: grouping/permission boundary
  project: default

  # SOURCES: Multiple sources for Helm chart + manifests
  sources:
    # Custom manifests (sealed secrets, PrometheusRules)
    - repoURL: https://github.com/Mosher-Labs/homelab-gitops.git
      targetRevision: main
      path: infrastructure/kube-prometheus-stack/manifests

    # Helm chart source
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.9.0
      helm:
        valuesObject:
          # Built-in alerts that repeat the observability module's Grafana
          # alerts (infrastructure/observability-alerts). The rest stay on:
          # certificates, kubelet, API server, Prometheus health, jobs,
          # quotas and clock skew have no Grafana equivalent.
          defaultRules:
            disabled:
              CPUThrottlingHigh: true  # container_cpu_throttled
              KubeContainerWaiting: true  # pod_waiting_failure
              KubeDaemonSetNotScheduled: true  # daemonset_not_ready
              KubeDaemonSetRolloutStuck: true  # daemonset_not_ready
              # deployment_under_replicated
              KubeDeploymentReplicasMismatch: true
              KubeDeploymentRolloutStuck: true  # deployment_rollout_stuck
              KubeHpaMaxedOut: true  # hpa_at_max
              KubeNodeNotReady: true  # node_not_ready
              KubeNodePressure: true  # node_pressure
              KubeNodeUnreachable: true  # node_not_ready
              KubePersistentVolumeFillingUp: true  # pvc_near_full_*
              KubePodCrashLooping: true  # pod_crash_looping
              # statefulset_under_replicated
              KubeStatefulSetReplicasMismatch: true
              NodeFilesystemAlmostOutOfSpace: true  # node_disk_full
              NodeFilesystemSpaceFillingUp: true  # node_disk_full
              NodeMemoryHighUtilization: true  # node_memory_high
              NodeNetworkReceiveErrs: true  # node_network_errors
              NodeNetworkTransmitErrs: true  # node_network_errors
              TargetDown: true  # scrape_target_down

          # Prometheus Operator Configuration
          prometheusOperator:
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

          # Prometheus Server Configuration
          prometheus:
            prometheusSpec:
              # Data retention
              retention: 14d
              retentionSize: "10GB"
              # Storage
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 15Gi
              # Resource limits, sized from 14 days of data (2026-10-03):
              # average 628Mi, max 900Mi. Request 1.25x average, limit 1.5x
              # max. It now also scrapes LiftTrace, Loki, Alloy and 11
              # blackbox probes, and serves the observability-alerts rules.
              resources:
                limits:
                  cpu: 500m
                  memory: 1536Mi
                requests:
                  cpu: 200m
                  memory: 768Mi
              # Service monitors
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false

          # Grafana Configuration
          grafana:
            # Admin credentials come from the grafana-admin SealedSecret in
            # manifests/ (the password is the "Grafana" item in 1Password).
            admin:
              existingSecret: grafana-admin
              userKey: admin-user
              # checkov:skip=CKV_SECRET_6: A Secret key name, not a value
              passwordKey: admin-password
            # Ingress for Grafana UI
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - grafana.mosher-labs.local
            # Resource limits. Grafana 13 runs an in-process API server; at
            # 256Mi / 200m it sat at its memory limit, SQLite calls timed out,
            # and failed health checks took it out of the Service. Since it
            # also evaluates the observability-alerts rules, 768Mi left it at
            # 80% (612Mi) under load, so 1Gi.
            resources:
              limits:
                cpu: 1000m
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            # Logs from infrastructure/loki
            additionalDataSources:
              - name: Loki
                type: loki
                uid: loki
                url: http://loki.monitoring.svc.cluster.local:3100
                access: proxy
            # Persistence
            persistence:
              enabled: true
              size: 5Gi
              storageClassName: local-path
            # Grafana configuration
            grafana.ini:
              server:
                root_url: http://grafana.mosher-labs.local
              analytics:
                check_for_updates: false
                reporting_enabled: false

          # AlertManager Configuration
          alertmanager:
            # AlertManager configuration via secret
            config:
              global:
                resolve_timeout: 5m
                slack_api_url_file: /etc/alertmanager/secrets/slack-webhook/url
              route:
                group_by: ["alertname", "cluster", "service"]
                group_wait: 10s
                group_interval: 10s
                repeat_interval: 12h
                receiver: "slack-notifications"
                routes:
                  - match:
                      alertname: Watchdog
                    receiver: "null"
                  - match:
                      alertname: InfoInhibitor
                    receiver: "null"
                  - match:
                      severity: critical
                    receiver: "slack-notifications"
                    continue: true
              receivers:
                - name: "null"
                - name: "slack-notifications"
                  slack_configs:
                    - channel: "#homelab-alerts"
                      title: "Homelab Alert: {{ .GroupLabels.alertname }}"
                      text: >-
                        {{ range .Alerts }}
                          *Alert:* {{ .Labels.alertname }}
                          *Severity:* {{ .Labels.severity }}
                          *Summary:* {{ .Annotations.summary }}
                          *Description:* {{ .Annotations.description }}
                          *Node:* {{ .Labels.node }}
                        {{ end }}
                      send_resolved: true

            # Ingress for AlertManager UI
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - alertmanager.mosher-labs.local

            alertmanagerSpec:
              # External URL so Slack notification links resolve outside the
              # cluster (defaults to the internal Service DNS name otherwise)
              externalUrl: "http://alertmanager.mosher-labs.local"
              # Mount slack webhook secret
              secrets:
                - slack-webhook
              # Resource limits
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              # Storage
              storage:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 2Gi

          # Disable k3s-incompatible components
          # k3s doesn't expose these as separate pods
          kubeEtcd:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          # kube-proxy is built into the k3s agent, so absent(up{job=
          # "kube-proxy"}) fires permanently and can never resolve.
          kubeProxy:
            enabled: false

          # Node exporter - collects node metrics
          nodeExporter:
            enabled: true

          # Kube-state-metrics - collects K8s object metrics
          kube-state-metrics:
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 64Mi

  # DESTINATION: Where should it be deployed?
  destination:
    # Kubernetes cluster (in-cluster API)
    server: https://kubernetes.default.svc
    # Target namespace
    namespace: monitoring

  # SYNC POLICY: How should ArgoCD keep things in sync?
  syncPolicy:
    # Automated sync: auto-deploy on Git push
    automated:
      prune: true
      selfHeal: true
    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Retry policy if sync fails
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
