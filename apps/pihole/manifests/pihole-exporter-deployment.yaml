---
# Deployment for PiHole Prometheus Exporter
# Runs as separate deployment to avoid circular dependency with PiHole pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter
  namespace: pihole
  labels:
    app: pihole-exporter
spec:
  # Single replica due to PiHole v6 API session limits
  replicas: 1
  selector:
    matchLabels:
      app: pihole-exporter
  template:
    metadata:
      labels:
        app: pihole-exporter
    spec:
      # HA: Topology spread for even distribution across nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pihole-exporter
      # HA: Prefer different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pihole-exporter
                topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pihole-exporter
          image: ghcr.io/mosher-labs/pihole6-exporter:1.1.11@sha256:137919d19955353a9a29c704d30b5cc7dc8a33dfd6c96c671bba3b27ca232dcf  # yamllint disable-line rule:line-length
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9617
              protocol: TCP
          args:
            - "-H"
            - "pihole-web.pihole.svc.cluster.local"
            - "--pihole-port"
            - "80"
            - "--protocol"
            - "http"
            - "-p"
            - "9617"
          env:
            - name: PIHOLE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pihole-password
                  key: password
          resources:
            limits:
              # Peak observed CPU is 6m, but a 50m quota is only 5ms per
              # 100ms CFS period, so scrape bursts throttled 21% of periods.
              # Headroom, not capacity.
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
