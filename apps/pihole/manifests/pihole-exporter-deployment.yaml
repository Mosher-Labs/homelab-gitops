---
# Deployment for PiHole Prometheus Exporter
# Runs as separate deployment to avoid circular dependency with PiHole pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter
  namespace: pihole
  labels:
    app: pihole-exporter
spec:
  # HA: 2 replicas for 2-node cluster
  replicas: 2
  selector:
    matchLabels:
      app: pihole-exporter
  template:
    metadata:
      labels:
        app: pihole-exporter
    spec:
      # HA: Topology spread for even distribution across nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pihole-exporter
      # HA: Prefer different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pihole-exporter
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pihole-exporter
          image: ghcr.io/mosher-labs/pihole6-exporter:latest
          ports:
            - name: metrics
              containerPort: 9617
              protocol: TCP
          args:
            - "-H"
            - "pihole-web.pihole.svc.cluster.local"
            - "--pihole-port"
            - "80"
            - "--protocol"
            - "http"
            - "-p"
            - "9617"
          env:
            - name: PIHOLE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pihole-password
                  key: password
          resources:
            limits:
              cpu: 50m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
