---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Sealed secret manifest (deployed first via sync wave)
    - repoURL: https://github.com/Mosher-Labs/homelab-gitops.git
      targetRevision: main
      path: apps/pihole/manifests
    # Helm chart for PiHole
    - repoURL: https://mojo2600.github.io/pihole-kubernetes/
      chart: pihole
      targetRevision: 2.34.0
      helm:
        valuesObject:
          # DNS service exposed via NodePort for network access
          serviceDns:
            type: NodePort
            nodePort: 30053
          serviceWeb:
            type: ClusterIP

          # Web UI ingress for management
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - pihole.mosher-labs.local
            path: /
            pathType: Prefix

          # Admin password - from sealed secret
          admin:
            enabled: true
            existingSecret: "pihole-password"
            passwordKey: "password"

          # Resource limits for homelab
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

          # Persistence for blocklists and config
          persistentVolumeClaim:
            enabled: true
            accessModes:
              - ReadWriteOnce
            size: 1Gi

          # DNS settings
          DNS1: "1.1.1.1"  # Cloudflare upstream
          DNS2: "1.0.0.1"  # Cloudflare upstream

          # Enable DNSSEC
          DNSSEC: "true"

          # Timezone
          timezone: "America/Denver"

  destination:
    server: https://kubernetes.default.svc
    namespace: pihole

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
