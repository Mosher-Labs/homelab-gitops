---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Sealed secret manifest (deployed first via sync wave)
    - repoURL: https://github.com/Mosher-Labs/homelab-gitops.git
      targetRevision: main
      path: apps/pihole/manifests
    # Helm chart for PiHole
    - repoURL: https://mojo2600.github.io/pihole-kubernetes/
      chart: pihole
      targetRevision: 2.34.0
      helm:
        valuesObject:
          # DNS service exposed via LoadBalancer with dedicated IP from MetalLB
          # Using .101 since Traefik ingress uses .100
          serviceDns:
            type: LoadBalancer
            port: 53
            loadBalancerIP: "192.168.87.101"
            annotations:
              # Allow TCP and UDP services to share the same IP
              metallb.universe.tf/allow-shared-ip: pihole-dns
          serviceWeb:
            type: ClusterIP
            # Note: sessionAffinity configured via manifest overlay
            # (Helm chart doesn't support sessionAffinity value)

          # Web UI ingress for management
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - pihole.mosher-labs.local
            path: /
            pathType: Prefix

          # Admin password - from sealed secret
          admin:
            enabled: true
            existingSecret: "pihole-password"
            passwordKey: "password"

          # Resource limits for homelab
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

          # HA: 2 replicas for 2-node cluster
          replicaCount: 2

          # Persistence disabled for stateless HA setup
          # Configuration is managed via Helm values (GitOps)
          persistentVolumeClaim:
            enabled: false

          # DNS settings
          DNS1: "1.1.1.1"  # Cloudflare upstream
          DNS2: "1.0.0.1"  # Cloudflare upstream

          # Enable DNSSEC
          DNSSEC: "true"

          # Block analytics/tracking domains for Discr development
          # This prevents home network traffic from skewing metrics
          blacklist:
            # Sentry error tracking
            - o4510563703193600.ingest.us.sentry.io
            # Cloudflare Web Analytics
            - static.cloudflareinsights.com
            - cloudflareinsights.com
            # Segment analytics (used by various services)
            - api.segment.io
            - cdn.segment.com

          # Timezone
          timezone: "America/Denver"

          # HA: Topology spread constraints for even distribution
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app: pihole
                  release: pihole

          # HA: Pod Disruption Budget - maintain at least 1 pod
          podDisruptionBudget:
            enabled: true
            minAvailable: 1

          # HA: Anti-affinity to prefer different nodes
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app: pihole
                    topologyKey: kubernetes.io/hostname

          # Monitoring - Prometheus metrics
          # NOTE: Sidecar disabled due to circular dependency (can't pull
          # image when PiHole/DNS is down). Using separate deployment instead.
          monitoring:
            # PodMonitor for separate deployment (not sidecar)
            podMonitor:
              enabled: false
            # Disable sidecar (use separate deployment)
            sidecar:
              enabled: false
              port: 9617
              image:
                repository: ekofr/pihole-exporter
                tag: latest
                pullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: 50m
                  memory: 128Mi
                requests:
                  cpu: 25m
                  memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: pihole

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
