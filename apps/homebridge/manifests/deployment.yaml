---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebridge
  namespace: homebridge
  labels:
    app: homebridge
  # The homebridge image runs s6-overlay as root, and its data volume is
  # owned by root, so it keeps the default security context.
  annotations:
    checkov.io/skip1: CKV_K8S_19=hostNetwork for mDNS and HomeKit discovery
    checkov.io/skip2: CKV_K8S_20=Image runs s6-overlay as root
    checkov.io/skip3: CKV_K8S_22=Image runs s6-overlay as root
    checkov.io/skip4: CKV_K8S_23=Image runs s6-overlay as root
    checkov.io/skip5: CKV_K8S_28=Image runs s6-overlay as root
    checkov.io/skip6: CKV_K8S_29=Image runs s6-overlay as root
    checkov.io/skip7: CKV_K8S_30=Image runs s6-overlay as root
    checkov.io/skip8: CKV_K8S_31=Image runs s6-overlay as root
    checkov.io/skip9: CKV_K8S_37=Image runs s6-overlay as root
    checkov.io/skip10: CKV_K8S_40=Image runs s6-overlay as root
spec:
  replicas: 1
  strategy:
    type: Recreate  # Only one instance can use hostNetwork
  selector:
    matchLabels:
      app: homebridge
  template:
    metadata:
      labels:
        app: homebridge
    spec:
      automountServiceAccountToken: false
      hostNetwork: true  # Required for mDNS/Bonjour and local device discovery
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: homebridge
          image: homebridge/homebridge:2026-09-25@sha256:22cdfca31934661ef9aaaa2e3fa74daa84a803fbf4c4a6c38c6bc1460b9f0596  # yamllint disable-line rule:line-length
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "America/Denver"
            - name: HOMEBRIDGE_CONFIG_UI
              value: "1"
            - name: HOMEBRIDGE_CONFIG_UI_PORT
              value: "8581"
          ports:
            - name: http
              containerPort: 8581
              protocol: TCP
            - name: homekit
              containerPort: 51826
              protocol: TCP
          volumeMounts:
            - name: homebridge-data
              mountPath: /homebridge
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8581
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8581
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: homebridge-data
          persistentVolumeClaim:
            claimName: homebridge-data
