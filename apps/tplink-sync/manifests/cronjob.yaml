---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tplink-sync
  namespace: tplink-sync
  annotations:
    checkov.io/skip1: CKV_K8S_19=hostNetwork is needed to reach the IoT network
    # yamllint disable-line rule:line-length
    checkov.io/skip2: CKV_K8S_14=The image has never been published and the app is not deployed; pin it when it is
    # yamllint disable-line rule:line-length
    checkov.io/skip3: CKV_K8S_43=The image has never been published and the app is not deployed; pin it when it is
spec:
  # Run daily at 2 AM
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true  # Need access to IoT network
          dnsPolicy: ClusterFirstWithHostNet
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: tplink-sync
              image: ghcr.io/mosher-labs/tplink-sync:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                # git needs a writable home; the root filesystem is read-only.
                - name: HOME
                  value: /tmp
                - name: UNIFI_HOST
                  value: "https://192.168.202.1:8443"
                - name: UNIFI_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: tplink-sync-secrets
                      key: unifi-username
                - name: UNIFI_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tplink-sync-secrets
                      key: unifi-password
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: tplink-sync-secrets
                      key: github-token
                - name: GITHUB_REPOSITORY
                  value: "Mosher-Labs/homelab-gitops"
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: tplink-sync-secrets
                      key: slack-webhook-url
                - name: HOMEBRIDGE_CONFIG
                  value: "/repo/apps/homebridge/config.json"
              volumeMounts:
                - name: repo
                  mountPath: /repo
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  cd /repo
                  REPO_URL="https://x-access-token:${GITHUB_TOKEN}"
                  REPO_URL="${REPO_URL}@github.com/${GITHUB_REPOSITORY}.git"
                  git clone "${REPO_URL}" .
                  python /app/sync-tplink-devices.py
          volumes:
            - name: repo
              emptyDir: {}
            - name: tmp
              emptyDir: {}
