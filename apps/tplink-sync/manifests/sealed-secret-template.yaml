---
# This is a template file. To create the actual sealed secret:
#
# 1. Create secrets.env with your credentials:
#    UNIFI_USERNAME=your-unifi-username
#    UNIFI_PASSWORD=your-unifi-password
#    GITHUB_TOKEN=your-github-pat
#    SLACK_WEBHOOK_URL=your-slack-webhook-url
#
# 2. Generate sealed secrets:
#    kubectl create secret generic tplink-sync-secrets \
#      --from-env-file=secrets.env \
#      --dry-run=client -o yaml | \
#    kubeseal --controller-namespace kube-system \
#      --controller-name sealed-secrets-controller \
#      --format yaml > sealed-secret.yaml
#
# 3. Delete secrets.env (contains plaintext credentials!)
#    rm secrets.env
#
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tplink-sync-secrets
  namespace: tplink-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    unifi-username: REPLACE_WITH_SEALED_VALUE
    unifi-password: REPLACE_WITH_SEALED_VALUE
    github-token: REPLACE_WITH_SEALED_VALUE
    slack-webhook-url: REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: tplink-sync-secrets
      namespace: tplink-sync
